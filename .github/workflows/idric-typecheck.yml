name: Idriç mail typecheck

on:
  push:
    branches:
      - "Idriç"
    paths:
      - "src/**/*.idric"
      - "test/generate_idric_*_conformance.py"
      - "fixtures/**/*.mbox"
      - "fixtures/manifest.json"
      - "mbox.ipkg"
      - ".github/workflows/idric-typecheck.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idric-mail-typecheck
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mbox
        uses: actions/checkout@v4
        with:
          path: mbox

      - name: Check out maintained Idriç compiler
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: "51e3892d4de59943e42e65c60a9814aba792c5d4"
          path: idric

      - name: Restore pinned Idriç build
        id: idric-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            idric/_/.tools
            idric/_/bootstrap-build
            idric/_/build
            idric/_/libs/prelude/build
            idric/_/libs/base/build
            idric/_/libs/contrib/build
            idric/_/libs/linear/build
            idric/_/libs/network/build
            idric/_/libs/test/build
          key: idric-linux-51e3892d4de59943e42e65c60a9814aba792c5d4-v1

      - name: Bootstrap Idriç
        if: steps.idric-cache.outputs.cache-hit != 'true'
        working-directory: idric
        run: ./edric bootstrap

      - name: Verify restored or built compiler
        working-directory: idric
        run: |
          test -x _/build/exec/idris2
          test -d _/bootstrap-build
          test -d _/libs/base/build

      - name: Save pinned Idriç build
        if: steps.idric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            idric/_/.tools
            idric/_/bootstrap-build
            idric/_/build
            idric/_/libs/prelude/build
            idric/_/libs/base/build
            idric/_/libs/contrib/build
            idric/_/libs/linear/build
            idric/_/libs/network/build
            idric/_/libs/test/build
          key: idric-linux-51e3892d4de59943e42e65c60a9814aba792c5d4-v1

      - name: Verify shared fixture bytes first
        working-directory: mbox
        run: sh tests/shared-fixtures.sh

      - name: Typecheck RFC-shaped mail modules
        run: |
          ./idric/edric --emit-one-step mbox/src/MailTypecheck.idric -o mbox/idric-mail.one-step
          grep -F "$(printf 'core_typecheck\tPASS')" mbox/idric-mail.one-step

      - name: Run exact shared fixture bytes through Idriç framer
        run: |
          python3 mbox/test/generate_idric_fixture_conformance.py > mbox/src/MboxFixtureRuntime.idric
          support="$GITHUB_WORKSPACE/idric/_"
          idric_library_path="$support/libs/prelude/build/ttc:$support/libs/base/build/ttc:$support/libs/linear/build/ttc:$support/libs/network/build/ttc:$support/libs/contrib/build/ttc:$support/libs/test/build/ttc:"
          (
            cd mbox/src
            PATH="$support/.tools/bin:$PATH" \
            CHEZ="$support/.tools/bin/scheme" \
            IDRIS2_PREFIX="$support/bootstrap-build" \
            IDRIS2_PATH="$idric_library_path" \
              "$support/build/exec/idris2" MboxFixtureRuntime.idric -o idric-fixtures
            ./build/exec/idric-fixtures | tee ../idric-fixtures.out
          )
          grep -Fx 'PASS Idriç shared framing fixtures' mbox/idric-fixtures.out

      - name: Run exact SPEC-LIST selection fixture through Idriç
        run: |
          python3 mbox/test/generate_idric_spec_list_conformance.py > mbox/src/SpecListFixtureRuntime.idric
          support="$GITHUB_WORKSPACE/idric/_"
          idric_library_path="$support/libs/prelude/build/ttc:$support/libs/base/build/ttc:$support/libs/linear/build/ttc:$support/libs/network/build/ttc:$support/libs/contrib/build/ttc:$support/libs/test/build/ttc:"
          (
            cd mbox/src
            PATH="$support/.tools/bin:$PATH" \
            CHEZ="$support/.tools/bin/scheme" \
            IDRIS2_PREFIX="$support/bootstrap-build" \
            IDRIS2_PATH="$idric_library_path" \
              "$support/build/exec/idris2" SpecListFixtureRuntime.idric -o idric-spec-list-fixtures
            ./build/exec/idric-spec-list-fixtures | tee ../idric-spec-list-fixtures.out
          )
          grep -Fx 'PASS Idriç SPEC-LIST selection fixture' mbox/idric-spec-list-fixtures.out

      - name: Emit normalized Idriç receipt
        working-directory: mbox
        run: |
          cat > tests/conformance/receipt.tsv <<'EOF'
          fixture.checksums	PASS	shared fixture checksum gate
          framing.empty	PASS	Idriç proof generated from empty.mbox bytes
          framing.lf-ranges	UNIMPLEMENTED	current framer exposes entry boundaries, not envelope-line end ranges
          framing.crlf-ranges	UNIMPLEMENTED	current framer exposes entry boundaries, not envelope-line end ranges
          framing.unescaped-from-splits	PASS	exact fixture boundary-event proof
          framing.content-length-ignored	PASS	exact LF fixture boundary-event proof
          framing.escaped-from-preserved	PASS	exact LF fixture boundary-event proof
          framing.empty-body	UNIMPLEMENTED	mbox header/body range layer not connected yet
          framing.eof-no-newline	PASS	exact LF fixture boundary-event proof reaches EOF
          streaming.chunk-equivalence	UNIMPLEMENTED	chunking equivalence theorem/test not yet committed
          headers.case-insensitive	UNIMPLEMENTED	mbox header integration incomplete
          headers.fold	UNIMPLEMENTED	mbox header integration incomplete
          headers.repeated	UNIMPLEMENTED	mbox header integration incomplete
          headers.empty-value	UNIMPLEMENTED	mbox header integration incomplete
          headers.colon-in-value	UNIMPLEMENTED	mbox header integration incomplete
          headers.malformed-preserved	UNIMPLEMENTED	mbox header integration incomplete
          headers.raw-byte-preservation	UNIMPLEMENTED	mbox header integration incomplete
          addresses.bare-and-display	UNIMPLEMENTED	address view not wired to mbox fixtures
          addresses.quoted-comma	UNIMPLEMENTED	address view not wired to mbox fixtures
          addresses.folded-repeated	UNIMPLEMENTED	address view not wired to mbox fixtures
          selection.spec-list-positive	PASS	exact Message-ID expectations from spec-list-selection.mbox
          selection.body-only-negative	PASS	body-only SPEC-LIST fixture is rejected
          selection.wrong-header-negative	PASS	unconfigured header SPEC-LIST fixtures are rejected
          copy.byte-identical	UNIMPLEMENTED	copy command not implemented
          copy.multiplicity	UNIMPLEMENTED	copy command not implemented
          transaction.ordinary	UNIMPLEMENTED	destructive refiler not implemented
          transaction.prepared	UNIMPLEMENTED	transaction journal not implemented
          transaction.mid-archive	UNIMPLEMENTED	transaction journal not implemented
          transaction.archive-fsynced	UNIMPLEMENTED	transaction journal not implemented
          transaction.new-source-tail	UNIMPLEMENTED	transaction journal not implemented
          transaction.mutated-prefix-refuse	UNIMPLEMENTED	transaction journal not implemented
          EOF
          cat tests/conformance/receipt.tsv
          sh tests/conformance/check-receipt.sh tests/conformance/cases.tsv tests/conformance/receipt.tsv
