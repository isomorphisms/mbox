name: RFC semantic type map

on:
  push:
    branches:
      - "Idriç"
    paths:
      - "standards/rfc/rfc5322.txt"
      - "standards/RFC5322_TYPE_MAP.tsv"
      - "src/Mail/Rfc5322.idric"
      - "tools/check-rfc5322-types"
      - ".github/workflows/rfc-semantic-types.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rfc5322:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require one semantic Idriç type for every RFC 5322 production
        run: ./tools/check-rfc5322-types
