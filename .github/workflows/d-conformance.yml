name: D conformance manifest

on:
  push:
    branches:
      - D
    paths:
      - "fixtures/**"
      - "tests/conformance/**"
      - ".github/workflows/d-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify shared fixture bytes
        run: sh tests/shared-fixtures.sh

      - name: Validate expected receipt schema
        shell: bash
        run: |
          set -euxo pipefail
          sh tests/conformance/check-receipt.sh             tests/conformance/cases.tsv             tests/conformance/expected.tsv

          if grep -q 'approved Ick/NetBSD toolchain.*blocked'               tests/conformance/expected.tsv; then
            echo 'stale GDC blocker leaked into current expected receipt' >&2
            exit 1
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: shared fixture checksums and the D expected-receipt schema are
          internally complete.

          This workflow does not execute the D implementation. Semantic PASS
          rows are earned only by the separate D implementation workflow using
          the pinned ICK DMD compiler.
          EOF
