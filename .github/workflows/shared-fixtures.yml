name: Shared mailbox fixtures

on:
  push:
    branches:
      - main
      - D
      - Agda
      - Grease
      - "Idriç"
      - Idris
  pull_request:
    paths:
      - "fixtures/**"
      - "tests/**"
      - "CONTRACT.md"
      - ".github/workflows/shared-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate shared fixture bytes and equations
        run: sh tests/shared-fixtures.sh
